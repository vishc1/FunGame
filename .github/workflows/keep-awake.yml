# Keeps the free Render game server awake during the day (it sleeps after 15 idle minutes and takes a minute to wake).
# GitHub runs this every 5 minutes between 9:00 and 23:00 in the owner's local time (UTC-07:00), which keeps
# the server inside Render's 750 free hours a month. Night-time: it sleeps, and the first visitor waits a minute.
name: keep the game server awake
on:
  schedule:
    - cron: '*/5 0,1,2,3,4,5,16,17,18,19,20,21,22,23 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping the server
        run: |
          for i in 1 2 3; do
            if curl -sf --max-time 60 https://friendgame.onrender.com/health; then echo; echo "awake"; exit 0; fi
            sleep 20
          done
          echo "no answer after 3 tries"; exit 1
