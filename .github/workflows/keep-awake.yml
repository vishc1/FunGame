# Keeps the free Render game server awake during the day (it sleeps after 15 idle minutes and takes a minute to wake).
# GitHub runs this every 5 minutes from 7 pm to 10 pm Pacific (02:00-04:59 UTC; an hour earlier on the clock once daylight
# saving ends), the usual play window. Outside it the server sleeps, and the first visitor waits a minute while it wakes.
name: keep the game server awake
on:
  schedule:
    - cron: '*/5 2,3,4 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping the server
        run: |
          for i in 1 2 3; do
            if curl -sf --max-time 60 https://friendgame.onrender.com/health; then echo; echo "awake"; exit 0; fi
            sleep 20
          done
          echo "no answer after 3 tries"; exit 1
